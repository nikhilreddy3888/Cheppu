name: VoiceForge
options:
  bundleIdPrefix: com.voiceforge
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  
settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "5.9"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  ENABLE_HARDENED_RUNTIME: YES
  
targets:
  VoiceForge:
    type: application
    platform: macOS
    sources:
      - path: VoiceForge/Sources
      - path: VoiceForge/Info.plist
        buildPhase: none
    resources:
      - path: VoiceForge/Resources
        excludes:
          - "*.swift"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.voiceforge.app
      PRODUCT_NAME: VoiceForge
      INFOPLIST_FILE: VoiceForge/Info.plist
      CODE_SIGN_ENTITLEMENTS: VoiceForge/VoiceForge.entitlements
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
      COMBINE_HIDPI_IMAGES: YES
      SWIFT_EMIT_LOC_STRINGS: YES
      ENABLE_PREVIEWS: YES
      GENERATE_INFOPLIST_FILE: NO
      LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        
    scheme:
      gatherCoverageData: false
      
packages: {}
